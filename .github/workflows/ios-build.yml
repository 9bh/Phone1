name: VaultX iOS Build

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build VaultX for iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate Xcode project
        run: |
          set -e
          echo "Repository directory:"
          pwd

          echo "Xcode projects:"
          find . -name "*.xcodeproj" -print

          echo "Shared schemes:"
          find . -path "*.xcodeproj/xcshareddata/xcschemes/*.xcscheme" -print

      - name: Show VaultX schemes
        run: |
          xcodebuild \
            -project "VaultX.xcodeproj" \
            -list

      - name: Build VaultX
        run: |
          set -o pipefail

          xcodebuild \
            -project "VaultX.xcodeproj" \
            -scheme "VaultX" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/VaultXDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

  build-unsigned-ipa:
    name: Create Unsigned iPhone IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned VaultX for iPhone
        run: |
          set -euo pipefail

          xcodebuild \
            -project "VaultX.xcodeproj" \
            -scheme "VaultX" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/VaultXDeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Locate application bundle
        id: locate_app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/VaultXDeviceDerivedData/Build/Products/Release-iphoneos/VaultX.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "VaultX.app was not found at the expected path."
            find "$RUNNER_TEMP/VaultXDeviceDerivedData" -name "*.app" -type d -print
            exit 1
          fi

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="$RUNNER_TEMP/VaultXUnsignedIPA"
          PAYLOAD_DIR="$OUTPUT_DIR/Payload"

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$PAYLOAD_DIR"

          cp -R "${{ steps.locate_app.outputs.app_path }}" "$PAYLOAD_DIR/VaultX.app"

          cd "$OUTPUT_DIR"
          /usr/bin/zip -qry "VaultX-unsigned.ipa" "Payload"

          shasum -a 256 "VaultX-unsigned.ipa" > "VaultX-unsigned.ipa.sha256"

          test -s "VaultX-unsigned.ipa"
          test -s "VaultX-unsigned.ipa.sha256"

      - name: Inspect unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA="$RUNNER_TEMP/VaultXUnsignedIPA/VaultX-unsigned.ipa"

          unzip -l "$IPA"

          if ! unzip -l "$IPA" | grep -q "Payload/VaultX.app/"; then
            echo "Invalid IPA structure: Payload/VaultX.app is missing."
            exit 1
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: VaultX-unsigned-ipa
          path: ${{ runner.temp }}/VaultXUnsignedIPA/VaultX-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  test:
    name: Run VaultXTests
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select iPhone Simulator
        id: select_simulator
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import subprocess
          import sys

          output = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"]
          )
          data = json.loads(output)

          for runtime_devices in data.get("devices", {}).values():
              for device in runtime_devices:
                  name = device.get("name", "")
                  udid = device.get("udid")

                  if name.startswith("iPhone") and udid:
                      with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
                          output_file.write(f"udid={udid}\n")

                      print(f"Selected simulator: {name} ({udid})")
                      sys.exit(0)

          print("No available iPhone simulator found.", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Boot Simulator
        run: |
          set -euo pipefail
          SIMULATOR_UDID="${{ steps.select_simulator.outputs.udid }}"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Run VaultX Tests
        run: |
          set -o pipefail
          SIMULATOR_UDID="${{ steps.select_simulator.outputs.udid }}"
          xcodebuild \
            -project "VaultX.xcodeproj" \
            -scheme "VaultX" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/VaultXTestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean test

      - name: Shutdown Simulator
        if: always()
        run: |
          SIMULATOR_UDID="${{ steps.select_simulator.outputs.udid }}"
          if [ -n "$SIMULATOR_UDID" ]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" || true
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VaultX-test-results
          path: ${{ runner.temp }}/VaultXTestDerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 14